[package]
name = "syndwell"
version = "0.1.0"
edition = "2021"
default-run = "syndwell"
license = "GPL-3.0-or-later"
[lib]
name = "syndwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-build", "dep:tauri-plugin-dialog"]
[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
[dependencies]
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "gzip"] }
feed-rs = "2"
url = "2"
scraper = "0.25"
readability = { version = "0.3", default-features = false }
chrono = "0.4"
roxmltree = "0.21"
base64 = "0.22"
[dev-dependencies]
tempfile = "3"
[[bin]]
name = "syndwell"
path = "src/main.rs"
required-features = ["desktop"]
[[bin]]
name = "syndwell-cli"
path = "src/cli.rs"
